name: Publish

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency: release

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        browser: [node, chrome, firefox]
    uses: algorandfoundation/algokit-shared-config/.github/workflows/node-ci.yml@main
    with:
      run-commit-lint: ${{ matrix.browser == 'node' }}
      audit-script: ${{ matrix.browser == 'node' && 'npm run audit' || 'true' }}
      lint-script: npm run lint && npm run format:check
      compile-script: npm run check-types
      # node-ci runs `prepare` (the build) after the install; type-check a consumer file against dist/
      pre-test-script: npx tsc -p tests/compile
      # The chromedriver swap is part of test-script because only the Test step gets
      # test-environment-variables. `make ci-test` starts the algorand-sdk-testing harness.
      test-script: ${{ matrix.browser == 'chrome' && 'bash scripts/ci/match-chromedriver.sh && ' || '' }}npm test && make ci-test
      test-environment-variables: ${{ matrix.browser == 'node' && '{}' || format('{{"TEST_BROWSER":"{0}"}}', matrix.browser) }}
      install-algokit: false
      polytest: false

  build:
    name: Build
    needs: ci
    uses: algorandfoundation/algokit-shared-config/.github/workflows/node-build-zip.yml@main
    with:
      build-path: dist
      artifact-name: package

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app_token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Set Git user as GitHub actions
        run: git config --global user.email "179917785+engineering-ci[bot]@users.noreply.github.com" && git config --global user.name "engineering-ci[bot]"

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package
          path: artifacts

      # -o: dist/esm/package.json is tracked in git, and unzip without -o exits 1 on it
      - name: Unzip package
        shell: bash
        run: |
          mkdir -p dist
          unzip -o -q "artifacts/package.zip" -d dist

      - name: Install dependencies to get semantic release components and plugins
        run: npm ci --ignore-scripts

      # NPM_CONFIG_IGNORE_SCRIPTS: `npm publish` must not run `prepare` (a rebuild),
      # so the tested dist/ from the build job is the one that is published.
      # GIT_AUTHOR_* / GIT_COMMITTER_*: identity of the README release commit made by
      # @semantic-release/git. In CI, semantic-release sets these variables to
      # semantic-release-bot unless they are set, and they override git config.
      - name: 'Semantic release'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          GIT_AUTHOR_NAME: engineering-ci[bot]
          GIT_AUTHOR_EMAIL: 179917785+engineering-ci[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: engineering-ci[bot]
          GIT_COMMITTER_EMAIL: 179917785+engineering-ci[bot]@users.noreply.github.com

      # A stable release adds the README release commit (and the tag on it) to `release`
      # after prod_release.yml has already merged `release` back to `main`. Merge it back
      # again, so that `main` has the updated README and the new tag in its history.
      - name: Merge release -> main
        if: github.ref_name == 'release'
        uses: devmasx/merge-branch@854d3ac71ed1e9deb668e0074781b81fdd6e771f # v1.4.0
        with:
          type: now
          from_branch: release
          target_branch: main
          message: Merge release back to main to get README update [no ci]
          github_token: ${{ steps.app_token.outputs.token }}
