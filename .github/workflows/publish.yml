name: "Publish NPM package to repository"

on: 
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The tag_version, e.g. vx.x.x. Use vx.x.x-beta.n to publish under the npm beta dist-tag.'
        default: 'vx.x.x'
        required: true
        type: 'string'
      node_version:
        description: 'The node_version to build with.'
        default: '24'
        required: true
        type: 'string'
      dry_run:
        description: 'Whether this is a dry_run publish.'
        default: 'true'
        required: true
        type: 'boolean'

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Determine NPM dist-tag
        id: release_type
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          if [[ "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
          elif [[ "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "npm-tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag_version doesn't match ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_version }}
      # Sets up .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: |
          # A mismatch here would publish a beta under the 'latest' tag, or vice versa
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "${TAG_VERSION#v}" ]]; then
            echo "package.json version ($PACKAGE_VERSION) doesn't match tag_version ($TAG_VERSION)"
            exit 1
          fi

          if git diff-index --quiet HEAD --; then
            echo 'DRY_RUN: '$DRY_RUN
            echo 'NPM_TAG: '$NPM_TAG
            if [ "$DRY_RUN" == 'false' ]; then
              npm publish --tag "$NPM_TAG"
            else
              npm publish --dry-run --tag "$NPM_TAG"
            fi
          else
            echo "There are unpublished changes"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ALGORAND_NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          NPM_TAG: ${{ steps.release_type.outputs['npm-tag'] }}
          TAG_VERSION: ${{ inputs.tag_version }}